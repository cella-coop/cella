# The lanes' gates (apps/org/rs/index.md, Gates): what a lane runs before
# it lands a change, at its commit (`corpus flow run gates --at <sha>`), so
# the run is logged over the commit that merges. `cella check`, then
# `cella test`; `manual`, so a push does not run it twice beside `test`.
on = ["manual"]
goals = ["cella-check", "cella-test"]
