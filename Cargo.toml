[workspace]
resolver = "2"
# Every rs/ package at any depth: a lib, a feat's core, a graft or a node's
# root. Cargo fails on a glob that matches nothing, so `apps/**/rs` joins
# the list with the first Rust package under apps/.
members = ["libs/*/rs"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Matan Bendix Shenhav <matan@shenhav.fyi>"]
repository = "https://codeberg.org/cella/cella"

[workspace.dependencies]
cella-crypto = { path = "libs/crypto/rs" }
cella-log = { path = "libs/log/rs" }
cella-keystore = { path = "libs/keystore/rs" }

ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core", "zeroize", "serde"] }
blake3 = { version = "1", default-features = false, features = ["std", "serde"] }
rand_core = { version = "0.6", features = ["std", "getrandom"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
fips204 = { version = "0.4", default-features = false, features = ["default-rng", "ml-dsa-44"] }
fips203 = { version = "0.4", default-features = false, features = ["default-rng", "ml-kem-768"] }
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2"
ciborium = "0.2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
