[workspace]
resolver = "2"
# Every rs/ package at any depth: a package in a core, a graft or a node's root.
members = ["apps/**/rs"]

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
license = "MPL-2.0"
authors = ["Matan Bendix Shenhav <matan@shenhav.fyi>"]
repository = "https://codeberg.org/cella/cella"

[workspace.dependencies]
cella-crypto = { path = "apps/org/core/crypto/rs" }
cella-log = { path = "apps/org/core/log/rs" }
cella-keystore = { path = "apps/org/core/keystore/rs" }
cella-guards = { path = "apps/org/core/guards/rs" }

ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core", "zeroize", "serde"] }
blake3 = { version = "1", default-features = false, features = ["std", "serde"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["std", "getrandom"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
fips204 = { version = "0.4", default-features = false, features = ["default-rng", "ml-dsa-44"] }
fips203 = { version = "0.4", default-features = false, features = ["default-rng", "ml-kem-768"] }
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2"
ciborium = "0.2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
loro = "=1.17.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# The crypto the notary and the CLI run is optimised in every build: in a
# debug build an Ed25519 check takes some ten milliseconds, so the notary's
# extension, which `cella db start` builds so, would take hours to verify a
# log of millions of entries.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# So are the guard primitives, the multiset hash among them, which the
# fold sums for every row it writes: unoptimised, a sum of two hashes
# takes some eighty microseconds, a fold of millions of entries hours.
[profile.dev.package.cella-guards]
opt-level = 3
