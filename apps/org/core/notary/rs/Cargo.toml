[package]
name = "cella"
description = "The cella Postgres extension: the notary and the guard primitives as SQL, thin wrappers over cella-guards"
version = "0.13.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg18 = ["pgrx/pg18"]
pg_test = ["dep:ed25519-dalek"]

[dependencies]
cella-guards = { workspace = true }
pgrx = "=0.19.3"
serde = { workspace = true }
serde_json = { workspace = true }
# Signs as a member's device in the pg_tests, which build into the library.
ed25519-dalek = { workspace = true, optional = true }

[dev-dependencies]
# pgrx's test cluster, for the pg_tests.
pgrx-tests = "=0.19.3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
