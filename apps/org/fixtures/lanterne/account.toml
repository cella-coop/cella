# The accounts: a part of the French chart of accounts, the periods they are
# kept in and the statutes' capital clauses, amounts in cents. July to September
# are closed; October is open, and so are the months after it to the end of
# the fiscal year. A cash account, the bank, says `cash = true`; a member's
# capital account names its member as `holder`, under 1013, and a departed
# one's says `frozen = true`. What members subscribed but have not paid is
# 1012, owed by them in 4562; what is owed to members who left is 4567.

