# The 2025 surplus, split as the statutes require and the law allows (loi
# n° 78-763, art. 33): the work share divided among the workers by salary,
# 15 % to the legal reserve, which is under the capital, the rest of the
# reserves to the development fund, and interest on capital within both.
# The decision that approved it is the account-decision graft's link; it is
# allocated, and posted, by the allocate write.
[[allocation]]
id = "al-2025"
year = 2025
surplus = 6140000
basis = "salary"

[[allocation.share]]
kind = "work"
percent = 45
amount = 2763000

[[allocation.share]]
kind = "legal"
percent = 15
amount = 921000

[[allocation.share]]
kind = "development"
percent = 25
amount = 1535000

[[allocation.share]]
kind = "interest"
percent = 15
amount = 921000
