# The co-op's units. The general assembly is every member; coordination is the
# circle leads and the manager; four working circles sit under it.

[[circle]]
id = "ag"
name = "Assemblée générale"
purpose = "every member, one vote: statutes, admissions, accounts and surplus"

[[circle]]
id = "coordination"
name = "Coordination"
parent = "ag"
purpose = "weekly: pipeline, staffing and anything that crosses circles"

[[circle]]
id = "web"
name = "Web"
parent = "coordination"
purpose = "sites, shops and applications"

[[circle]]
id = "brand"
name = "Brand"
parent = "coordination"
purpose = "identity, print, packaging, illustration and motion"

[[circle]]
id = "marketing"
name = "Marketing"
parent = "coordination"
purpose = "strategy, content, social media and campaigns"

[[circle]]
id = "operations"
name = "Operations"
parent = "coordination"
purpose = "finance, administration, contracts and tools"

[[role]]
id = "member"
circle = "ag"
name = "Member"
duty = "every member, seated in the assembly; what every member may do is granted to it"

[[role]]
id = "manager"
circle = "ag"
name = "Gérante"
duty = "the legal representative, elected by the assembly for four years"

[[role]]
id = "lead"
circle = "*"
name = "Circle lead"
duty = "runs a working circle and sits on coordination"

[[role]]
id = "secretary"
circle = "*"
name = "Secretary"
duty = "keeps a circle's minutes and records who came to its meetings"

[[role]]
id = "finance"
circle = "operations"
name = "Finance"
duty = "issues invoices, pays suppliers and closes the books each month"

[[role]]
id = "treasurer"
circle = "ag"
name = "Treasurer"
duty = "finance's hand in the assembly: approves everyone's time for the pay run"

[[mandate]]
role = "member"
power = "edit-client"
text = "add and edit clients"

[[mandate]]
role = "member"
power = "edit-document"
text = "edit, version and comment on documents"

[[mandate]]
role = "member"
power = "edit-task"
text = "create, assign, file and move tasks"

[[mandate]]
role = "member"
power = "log-time"
text = "log and submit one's own time"

[[mandate]]
role = "member"
power = "invite-member"
text = "invite someone to join, with their first device"

[[mandate]]
