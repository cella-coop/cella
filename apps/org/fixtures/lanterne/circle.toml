# The co-op's units, none in another. The general assembly is every member; coordination is the
# circle leads and the manager; four working circles beside them, and
# four more that look after the co-op itself: its clients, its hiring,
# its people's care and its own tools. What
# each role may do is a mandate, a policy the founding assembly adopted
# (`motion.toml`).

[[circle]]
id = "ag"
name = "Assembly"
assembly = true
purpose = "every member, one vote: statutes, admissions, accounts and surplus"

[[circle]]
id = "coordination"
name = "Coordination"
purpose = "weekly: pipeline, staffing and anything that crosses circles"

[[circle]]
id = "web"
name = "Web"
purpose = "sites, shops and applications"

[[circle]]
id = "brand"
name = "Brand"
purpose = "identity, print, packaging, illustration and motion"

[[circle]]
id = "marketing"
name = "Marketing"
purpose = "strategy, content, social media and campaigns"

[[circle]]
id = "operations"
name = "Operations"
purpose = "finance, administration, contracts and tools"

[[circle]]
id = "clients"
name = "Clients"
purpose = "client relationships: briefs, proposals, renewals and care after launch"

[[circle]]
id = "hiring"
name = "Hiring"
purpose = "recruitment, onboarding and the path to membership"

[[circle]]
id = "care"
name = "Care"
purpose = "wellbeing, workload, conflict and peer support"

[[circle]]
id = "tools"
name = "Tools"
purpose = "the studio's own stack: hosting, accounts, licences and internal tooling"

# The features each circle enabled, in its order, an accordion's run
# after its name and a colon (`apps/org/core/circle/index.md#features`).

[[feature]]
circle = "ag"
features = "Governance: motion, policy, document, meeting; Members: membership, patronage, person, circle"

[[feature]]
circle = "coordination"
features = "Governance: motion, meeting, document; project"

[[feature]]
circle = "web"
features = "project, task, timesheet, file, contact"

[[feature]]
circle = "brand"
features = "project, task, timesheet, file, bill"

[[feature]]
circle = "marketing"
features = "project, task, timesheet, contact, document"

[[feature]]
circle = "operations"
features = "Books: account, transaction, report, import; Payments: invoice, bill, expense, payslip; contact, employment"

[[feature]]
circle = "clients"
features = "contact, project, task, document; Governance: motion, meeting"

[[feature]]
circle = "hiring"
features = "task, document, employment; Governance: motion, meeting"

[[feature]]
circle = "care"
features = "task, meeting, document, motion"

[[feature]]
circle = "tools"
features = "project, task, timesheet, expense, file"

[[role]]
id = "member"
circle = "ag"
name = "Member"
duty = "every member, seated in the assembly; what every member may do is granted to it"

[[role]]
id = "manager"
circle = "ag"
name = "Manager"
duty = "the legal representative, elected by the assembly for four years"
holders = 1

[[role]]
id = "lead"
circle = "*"
name = "Circle lead"
duty = "runs a working circle and sits on coordination"
holders = 1

[[role]]
id = "secretary"
circle = "*"
name = "Secretary"
duty = "keeps a circle's minutes and records who came to its meetings"
holders = 1

[[role]]
id = "finance"
circle = "operations"
name = "Finance"
duty = "issues invoices, pays suppliers and closes the books each month"
holders = 1

[[role]]
id = "treasurer"
circle = "ag"
name = "Treasurer"
duty = "finance's hand in the assembly: approves everyone's time for the pay run"
holders = 1

[[role]]
id = "print-buyer"
circle = "brand"
name = "Print buyer"
duty = "orders Brand's print and paper and approves their bills"
holders = 1


