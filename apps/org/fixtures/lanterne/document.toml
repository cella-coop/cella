# The minutes of the assembly of 20 June 2026, which Julien took and saved
# two days later; they open on the meeting's card, as minutes begun from
# a meeting's page do, and cite the motions the assembly took.
[[document]]
id = "minutes-ag-2026-06-20"
title = "Minutes, Annual general assembly"

[[document.version]]
id = "minutes-ag-2026-06-20@1"
saved = 2026-06-22

[[document.version.block]]
type = "heading"
level = 1
text = "Minutes, Annual general assembly"

[[document.version.block]]
type = "embed"
embed = "meeting"
ref = "ag-2026-06-20"

[[document.version.block]]
type = "heading"
level = 2
text = "Present"

[[document.version.block]]
text = "All ten members, at the studio: Camille, Yusuf, Hugo, Julien, Léa, Thomas, Sofia, Malik, Amina and Chloé. Camille chaired; Julien took the minutes."

[[document.version.block]]
type = "heading"
level = 2
text = "1. The 2025 accounts and the surplus"

[[document.version.block]]
runs = [
  { text = "Julien presented the 2025 accounts, closing on a surplus of " },
  { text = "61 400 €", bold = true },
  { text = ". The assembly approved them and split the surplus as loi 78-763, art. 33 allows: 45 % to the members for their work, 15 % to the legal reserve, 39,27 % to the development fund and 0,73 % as interest on capital, 448,22 € on its 13 000 €, within the 3,5 % the statutes pay (loi 47-1775, art. 14)." },
]

[[document.version.block]]
type = "embed"
embed = "motion"
ref = "m-2026-006"

[[document.version.block]]
type = "heading"
level = 2
text = "2. The internal rules, version 3"

[[document.version.block]]
text = "Camille presented version 3, which adds remote work days and the solidarity rate for associations. Every member consented."

[[document.version.block]]
type = "embed"
embed = "motion"
ref = "m-2026-007"

[[document.version.block]]
type = "heading"
level = 2
text = "Closed"

[[document.version.block]]
text = "The session closed at 12:40."

# The statutes, generated from the assembly's policies and written by no
# one: a `circle` names whose policies a document reads, and its
# `template` is the fixed text of the legal form, a SCOP SARL à capital
# variable after the CG Scop's model statutes (not checked on
# Légifrance), each `policies` embed where the policies of the kind its
# ref names read, in order, and its `departures` embed where the defaults
# of the form its ref names the assembly left read, or a line saying it
# left none.
# The seed generates a version at each day the assembly's policies
# changed, and adopts it that day: statutes@1 on 1 March 2021, statutes@2
# on 20 June 2026.
[[document]]
id = "statutes"
title = "Statuts"
circle = "ag"

[[document.template]]
type = "heading"
level = 1
text = "Statuts de Lanterne SCOP SARL à capital variable"

[[document.template]]
text = "Lanterne is a société coopérative et participative, a société à responsabilité limitée à capital variable, governed by loi n° 47-1775 of 10 September 1947, loi n° 78-763 of 19 July 1978 and the Code de commerce. Its object is graphic design and illustration for print and the web. Its seat is at 14 rue des Graviers, 93100 Montreuil, and it is formed for ninety-nine years."

[[document.template]]
text = "Its associates are those who work in it and have subscribed its shares. Each associate holds one vote, whatever the shares they hold. Its capital varies as associates join and leave, and never falls below a quarter of the highest it has reached."

[[document.template]]
text = "What follows is what the associates adopted, in force as these statutes were generated: each article a policy of the assembly, as the motion that adopted it worded it."

