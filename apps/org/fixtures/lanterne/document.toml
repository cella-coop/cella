# The statutes, generated from the assembly's policies and written by no
# one: its `circle`, which owns it, names whose policies it reads, and
# its `template`, which makes it generated, is the fixed text of the
# legal form, a worker co-operative limited company with variable capital after the CG Scop's model
# statutes (not checked on Légifrance), each `policies` embed where the policies of the kind its
# ref names read, in order, and its `departures` embed where the defaults
# of the form its ref names the assembly left read, or a line saying it
# left none.
# The seed generates a version at each day the assembly's policies
# changed, and adopts it that day: statutes@1 on 1 March 2021, statutes@2
# on 20 June 2026.
[[document]]
id = "statutes"
title = "Statutes"
circle = "ag"

[[document.template]]
type = "heading"
level = 1
text = "Statutes of Lanterne, worker co-operative limited company with variable capital"

[[document.template]]
text = "Lanterne is a worker co-operative limited company with variable capital, governed by Act No. 47-1775 of 10 September 1947, Act No. 78-763 of 19 July 1978 and the French Commercial Code. Its object is graphic design and illustration for print and the web. Its seat is at 14 rue des Graviers, 93100 Montreuil, and it is formed for ninety-nine years."

[[document.template]]
text = "Its associates are those who work in it and have subscribed its shares. Each associate holds one vote, whatever the shares they hold. Its capital varies as associates join and leave, and never falls below a quarter of the highest it has reached."

[[document.template]]
text = "What follows is what the associates adopted, in force as these statutes were generated: each article a policy of the assembly, as the motion that adopted it worded it."

