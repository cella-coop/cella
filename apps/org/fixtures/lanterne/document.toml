[[document.version]]
id = "internal-rules@3"
saved = 2026-05-28
body = """
# Règlement intérieur

## Working time
A full-time member works 35 hours a week. Up to three days a week may be
worked remotely; Tuesday is a studio day for everyone.

## Pay
Pay follows one grid: the ratio between the highest and the lowest salary is
at most 1.6.

## Rates
The standard day rate is set each year by coordination. Associations and
co-ops with fewer than ten staff pay the solidarity rate.

## Clients we refuse
We do not work for fossil fuel companies, arms makers or political parties.
"""

