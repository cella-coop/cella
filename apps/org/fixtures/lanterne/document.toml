# Documents and their versions. Each version is an outline of blocks in
# reading order: a `type` (paragraph unless named), a `depth` (0 at the top,
# one more than the block it nests under), the props its type keeps, and its
# text, plain or as runs with their marks. The seed carries each version
# over into the next, keeping the blocks that did not change, so edits
# between versions are Loro's and are not fixtures. A document names the
# circle it is owned by; one that names none is the assembly's.

