[[motion]]
id = "m-2026-011"
circle = "coordination"
title = "Raise the day rate for 2027"
procedure = "consent"
proposed = 2026-10-12
deadline = 2026-11-09
body = """
Raise the standard day rate from 520 € to 560 €, keep the solidarity rate
at 380 €, and publish the rate card as drafted.
"""
# What it decides beyond its text: the rate card adopted as version 2
# holds it.
[[motion.action]]
kind = "adopt"
args = { version = "rate-card-2027@2" }

[[motion.vote]]
member = "camille@lanterne.example"
stance = "consent"
at = 2026-10-13

[[motion.vote]]
member = "malik@lanterne.example"
stance = "object"
at = 2026-10-14

