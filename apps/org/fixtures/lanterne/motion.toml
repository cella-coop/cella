# Proposals and the signed votes on them. An outcome is never stored: it is
# computed from the votes the notary counted before the deadline.

# The statutes' two assemblies, beside the built-in consent, majority and
# two thirds. The ordinary assembly decides by a majority of the votes cast
# once a quarter of the associates take part; the extraordinary, which
# amends the statutes, by two thirds of the votes cast once half take part.
# These follow the CG Scop's model statutes for a SCOP SARL under loi
# n° 78-763 of 19 July 1978; the articles were not checked on Légifrance,
# which refuses the box.
[[procedure]]
id = "ordinary"
label = "Ordinary assembly"
method = "majority"
quorum = [1, 4]

[[procedure]]
id = "extraordinary"
label = "Extraordinary assembly"
method = "majority"
share = [2, 3]
quorum = [1, 2]

[[motion]]
id = "m-2026-006"
circle = "ag"
title = "Approve the 2025 accounts and allocate the surplus"
procedure = "majority"
proposed = 2026-06-01
deadline = 2026-06-20
closed = 2026-06-20
body = """
The 2025 surplus of 61 400 € is allocated as the statutes require: 45 % to
the members as their share of work (participation), 54,27 % to the
indivisible reserves and 0,73 % as interest on capital, 448,22 € on its
13 000 €, within the 3,5 % the statutes pay (loi 47-1775, art. 14).
"""
# What it decides beyond its text: the 2025 distribution approved.
[[motion.action]]
