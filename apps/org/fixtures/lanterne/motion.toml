# role there, so whoever sits in a circle proposes and discusses its
# motions, writes in its channel and draws up its meetings' agendas.
[[motion.action]]
kind = "policy"
args = { kind = "mandate", wording = "The {role: participant} role holds {power: propose}, to propose a motion of the circle and close it", takes = "scop-sarl-fr:propose" }

[[motion.action]]
