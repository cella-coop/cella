args = { kind = "mandate", wording = "The {role: participant} role holds {power: discuss}, to discuss the circle's motions, write in its channel and draw up its meetings' agendas", takes = "scop-sarl-fr:discuss" }

# The collective mandates: each circle that carries an action by motion
# holds the power for it on itself, used only by a motion of that circle.
# The assembly admits, suspends and excludes members, adopts and ends
# policies, the statutes' among them, approves the distribution and
# adopts documents, and with coordination
# seats members; coordination grants and revokes the
# working circles' mandates and adopts their documents, the rate card
# among them. The working circles hold none. Those that hand out
# mandates, adopting and ending policies and giving and ending seats, are
# protected: only a motion decided by the extraordinary assembly's
# procedure, or a stricter one, replaces or ends them.
[[motion.action]]
kind = "policy"
args = { kind = "mandate", wording = "The {circle: ag} circle holds {power: admit-member}, to admit members, by motion", takes = "scop-sarl-fr:admit-member" }

[[motion.action]]
