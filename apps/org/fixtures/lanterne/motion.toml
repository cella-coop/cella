# The law's floors on each year's surplus, as the SCOP SARL's defaults
# state them: at least a quarter to all the employees as the work share,
# and at least 15 % to the reserves (loi n° 78-763 art. 33, unreviewed).
# Their values are named for no feat, so they bind by the members'
# judgement; the distribution Lanterne approves keeps above both.
[[motion.action]]
kind = "policy"
args = { kind = "rule", wording = "At least {work_share: 25 % | more is stricter} of each year's surplus goes to all the employees as the work share", friendly = "At least a quarter of the surplus goes to the workers.", takes = "scop-sarl-fr:work-share" }

[[motion.action]]
kind = "policy"
args = { kind = "rule", wording = "At least {reserve_share: 15 % | more is stricter} of each year's surplus goes to the reserves", friendly = "At least 15 % of the surplus is kept in reserve.", takes = "scop-sarl-fr:reserves" }

# The right to withdraw: a member leaves by their own action, no
# motion's. It is worded on every person, since the withdrawal ends the
# membership on its own verdict date; the membership feat holds it to
# their own. Protected as every right is.
[[motion.action]]
kind = "policy"
args = { kind = "right", wording = "Every {right: person} holds {power: withdraw-membership}, to withdraw their own membership", protected = "extraordinary", takes = "scop-sarl-fr:withdraw-membership" }

# The right to apply: an employee who
# has worked a year asks to join by their own action, which puts their
# admission to the assembly, and the assembly must rule on it.
# Protected as every right is.
[[motion.action]]
kind = "policy"
args = { kind = "right", wording = "Every {right: employee} holds {power: apply-membership}, to apply to join once they have worked a year, which the assembly must rule on", protected = "extraordinary", takes = "scop-sarl-fr:apply-membership" }

# How a circle is made: the assembly creates one by motion, and it holds
# the default bundle from that day, the mandates on the participant, lead
# and secretary roles, which every circle has.
[[motion.action]]
kind = "policy"
args = { kind = "mandate", wording = "The {circle: ag} circle holds {power: create-circle}, to create a circle, by motion", takes = "scop-sarl-fr:create-circle" }

# Reading, the last of the founding motion: every seat reads its own
# circle's records and the assembly's, the whole co-op's, and Lanterne
# keeps open books, so every member reads every circle's records, and
# Inès, employed, no member and in Web alone, reads Web's and the
# statutes she would join under, and not Marketing's. A mandate for a
# power that reads a feat's rows reads them by its scope beside them.
# They are Lanterne's own, no default of the form.
[[motion.action]]
kind = "policy"
args = { kind = "mandate", wording = "The {role: participant} role holds {power: read}, to read the records of its {scope: own} circle" }

[[motion.action]]
kind = "policy"
args = { kind = "mandate", wording = "The {role: participant} role holds {power: read}, to read the records of the {scope: ag} circle, the whole co-op's" }

[[motion.action]]
kind = "policy"
args = { kind = "mandate", wording = "The {role: member} role holds {power: read}, to read every circle's records" }

# Open books' disclosure rule, with the disclosure study's defaults: a
# total of members' own figures, a month's payroll or a project's time,
# reads to every member only where at least five people put into it and
# no one or two make most of it. Core copies its values into
# circle.disclosure, which the analytics port reads.
[[motion.action]]
kind = "policy"
args = { kind = "rule", wording = "Open books shares a total of members' own figures with every member where at least {disclosure_contributors: 5 | more is stricter} people put into it, none of them more than {disclosure_largest: 50 % | less is stricter} of it and no two more than {disclosure_two: 80 % | less is stricter}" }

