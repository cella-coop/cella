# Patronage: the statutes' terms for the work share, adopted when the
# co-op was founded and carried over, and each year's distribution of its
# surplus, amounts in cents. The work share divides among the workers by
# pay, and half of each associate's part is employed in shares of the
# capital, the rest paid (Code du travail, art. L3324-5 and R3323-11).
# Later terms are drafted here and adopted by a decision of the assembly
# that moves to adopt them.
[[terms]]
id = "st-2021"
from = 2021
salary = 100
capital = 50
adopted = 2021-03-01

# The 2025 surplus, split as the statutes require and the law allows (loi
# n° 78-763, art. 33): the work share divided among the workers by salary,
# 15 % to the legal reserve, which is under the capital, the rest of the
# reserves to the development fund, and interest on capital within both.
# The decision that approves it is the decision-patronage graft's link; it
# is approved by the approve write, which makes each worker's part, then
# distributed, posted and its shares credited, by the distribute write.
[[distribution]]
id = "2025"
year = 2025
surplus = 6140000
basis = "salary"

[[distribution.share]]
kind = "work"
percent = 45
amount = 2763000

[[distribution.share]]
kind = "legal"
percent = 15
amount = 921000

[[distribution.share]]
kind = "development"
percent = 25
amount = 1535000

[[distribution.share]]
kind = "interest"
percent = 15
amount = 921000
