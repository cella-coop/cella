# The scope this deployment serves: one co-op. `form`, `siren`, `rcs` (the
# town of the registry's court), `vat` and `seat` are what its invoices
# print; a SCOP's capital varies, so its form says so and `capital`, the
# amount a fixed capital prints, is not set. `legal_form` is the legal
# form it chose, as cella offers it (_corpus/doc/forms.md), which its
# founding names and whose defaults its founding motion takes;
# `founding` is that motion, which its founders decided.
name = "Lanterne"
legal_name = "Lanterne SCOP SARL"
form = "SCOP SARL à capital variable"
legal_form = "scop-sarl-fr"
founding = "m-2021-001"
address = "lanterne.example"
siren = "000000000"
rcs = "Bobigny"
vat = "FR00000000000"
seat = "14 rue des Graviers, 93100 Montreuil, France"
founded = 2021-03-01
fiscal_year = "calendar"
currency = "EUR"
timezone = "Europe/Paris"
today = 2026-10-24
