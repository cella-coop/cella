# The scope this deployment serves: one coop. `form`, `siren`, `rcs` (the
# town of the registry's court), `vat` and `seat` are what its invoices
# print; a SCOP's capital varies, so its form says so and `capital`, the
# amount a fixed capital prints, is not set. `legal_form` is the legal
# form it chose, as cella offers it (_corpus/doc/forms.md), which its
# founding names and whose defaults its founding motion takes;
# `founding` is that motion, which its founders decided. `logo` is its
# mark, an SVG its particulars adopt with its name: a lantern, its amber
# glass lit, on a teal tile.
