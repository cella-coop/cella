# Lanterne's time since timesheets began on 1 September 2026, and its
# workers' months, the members' and Inès's. A run is the same entry logged
# on every working day, Monday to Friday, from one day to another: the
# seed logs one entry per day of it. Each worker's runs make seven hours
# a working day, the 35-hour week of the internal rules. Billable time is
# what the invoices bill, at the rate in graft.project-timesheet.toml; which
# project a run's time is for is that graft's.
#
# September is submitted by everyone and approved: each circle's lead
# approves their circle's members, Julien in finance the leads and Inès,
# and Camille as gérante Julien. October is open.

