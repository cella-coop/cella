# Cella on the workshop's forge: its decisions and their steps are
# _corpus/change/ docs, queued on the workshop's worker page.
[drift]
uncited = "warn"

# The gates (apps/org/rs/index.md, Gates): `cella check`, then `cella
# test`, each in the devshell (`nix develop -c`), which carries the
# toolchain, the C compiler cargo links with and pgrx's settings, so they
# run alike from a lane's shell and in the detached checkout `flow run
# --at` makes. They replace the suites corpus infers from `Cargo.toml`
# and `package.json`: no flow names those. `cella` installs the npm
# workspace offline, and pnpm keeps a store per filesystem, so the
# lockfile's packages are fetched into the store the checkout reads first;
# a store that holds them already fetches nothing.
[[op]]
name = "cella-check"
run = ["nix", "develop", "-c", "sh", "-c", "pnpm fetch --silent && cella check"]
kind = "check"

# `cella test` needs the dev cluster, which a fresh checkout has not
# made: it is started on ports of the run's own, so lanes gating at once
# on the box never meet on one, and stopped after, pass or fail, since
# the checkout it lives in is removed when the run ends.
[[op]]
name = "cella-test"
run = ["nix", "develop", "-c", "sh", "-c", "export CELLA_PGPORT=$((20000 + $$ % 20000)) CELLA_ANALYTICS_PORT=$((40000 + $$ % 20000)); cella db start && cella test; status=$?; cella db stop; exit $status"]
kind = "check"
needs = ["cella-check"]

# The fold's scale tier (apps/org/rs/index.md, Gates), which the nightly
# `scale` flow runs at a tenth of its size, about a million entries, the
# most the box's disk holds. Like `cella-test`, it fetches the lockfile's
# packages for the offline install and runs on a dev cluster of its own
# ports, stopped after, pass or fail.
[[op]]
name = "cella-scale"
run = ["nix", "develop", "-c", "sh", "-c", "pnpm fetch --silent && export CELLA_PGPORT=$((20000 + $$ % 20000)) CELLA_ANALYTICS_PORT=$((40000 + $$ % 20000)); cella db start && cella test scale --members 1000; status=$?; cella db stop; exit $status"]
kind = "check"
