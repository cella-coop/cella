# Cella on the workshop's forge: its decisions and their steps are
# _corpus/change/ docs, queued on the workshop's worker page.
[drift]
uncited = "warn"

# The site, the brand and the diagrams are decoupled (apps/org/rs/index.md,
# Gates): a release counts a change's gates past main moving only in them,
# where the change touches none of them.
[review]
decoupled = ["apps/site/**", "packages/brand/**", "packages/diagrams/**"]

# The gates (apps/org/rs/index.md, Gates): the org's check, `cella check
# org`, then `cella test`, and the site's check, `cella check site`, each
# in the devshell (`nix develop -c`), which carries the toolchain, the C
# compiler cargo links with and pgrx's settings, so they run alike from a
# lane's shell and in the detached checkout `flow run --at` makes. They
# replace the suites corpus infers from `Cargo.toml` and `package.json`:
# no flow names those. `cella` installs the npm workspace offline, and
# pnpm keeps a store per filesystem, so the lockfile's packages are
# fetched into the store the checkout reads first; a store that holds
# them already fetches nothing.
#
# Each says what it `reads`, so its pass is kept under the hash of those
# files and a later commit selecting the same ones takes it: a change in
# the site alone runs the site's check, in minutes, and one in the org
# alone the org's. The org's ops read everything but the site and the
# diagrams, whose manifests they read through the feat check's edges and
# the install; the root tsconfig leaves the diagrams to the site's check,
# and `cella test tools` the site's tools' tests.
[[op]]
name = "cella-check"
run = ["nix", "develop", "-c", "sh", "-c", "pnpm fetch --silent && cella check org"]
kind = "check"
reads = ["**", "!apps/site/src", "!apps/site/public", "!apps/site/test", "!apps/site/index.md", "!apps/site/astro.config.mjs", "!apps/site/tsconfig.json", "!apps/site/.prettierrc.json", "!packages/diagrams/src", "!packages/diagrams/index.md", "!packages/diagrams/tsconfig.json"]

# `cella test` needs the dev cluster, which a fresh checkout has not
# made: it is started on ports of the run's own, so lanes gating at once
# on the box never meet on one, and stopped after, pass or fail, since
# the checkout it lives in is removed when the run ends.
#
# A lane's `cella-test` runs the e2e scenarios its change reaches
# (apps/org/rs/index.md, Gates): `--since` main as the lane fetched it,
# `origin/main`, or `main` where the checkout has no remote, so the diff
# from where the branch leaves main picks them; a checkout with neither
# runs them all. It drives Chromium alone (`BROWSERS=chromium`), the
# version's own check before review; `cella-test-all` is the whole suite
# in every browser, under a name of its own so a selected pass is never
# kept for it: the integrator's `merge` needs it, and the `test` flow a
# push runs, so main is still guarded in Chromium, Firefox and WebKit.
[[op]]
name = "cella-test"
run = ["nix", "develop", "-c", "sh", "-c", "export CELLA_PGPORT=$((20000 + $$ % 20000)) CELLA_ANALYTICS_PORT=$((40000 + $$ % 20000)) BROWSERS=chromium; base=$(git rev-parse -q --verify origin/main || git rev-parse -q --verify main); cella db start && cella test ${base:+--since $base}; status=$?; cella db stop; exit $status"]
kind = "check"
needs = ["cella-check"]
reads = ["**", "!apps/site/src", "!apps/site/public", "!apps/site/test", "!apps/site/index.md", "!apps/site/astro.config.mjs", "!apps/site/tsconfig.json", "!apps/site/.prettierrc.json", "!packages/diagrams/src", "!packages/diagrams/index.md", "!packages/diagrams/tsconfig.json"]

[[op]]
name = "cella-test-all"
run = ["nix", "develop", "-c", "sh", "-c", "export CELLA_PGPORT=$((20000 + $$ % 20000)) CELLA_ANALYTICS_PORT=$((40000 + $$ % 20000)); cella db start && cella test; status=$?; cella db stop; exit $status"]
kind = "check"
needs = ["cella-check"]
reads = ["**", "!apps/site/src", "!apps/site/public", "!apps/site/test", "!apps/site/index.md", "!apps/site/astro.config.mjs", "!apps/site/tsconfig.json", "!apps/site/.prettierrc.json", "!packages/diagrams/src", "!packages/diagrams/index.md", "!packages/diagrams/tsconfig.json"]

# The site's check reads the site, the brand, the diagrams and what runs
# it: the CLI and the crate it builds on, the tools and their tests, the
# settings the text's guard reads, the flake, every manifest the install
# and cargo read, and the lockfiles.
[[op]]
name = "site-check"
run = ["nix", "develop", "-c", "sh", "-c", "pnpm fetch --silent && cella check site"]
kind = "check"
reads = ["apps/site", "packages/brand", "packages/diagrams", "apps/org/rs", "apps/org/core/guards/rs", "tools", ".claude/settings.json", "flake.nix", "flake.lock", "**/package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.json", "**/Cargo.toml", "Cargo.lock"]

# The fold's scale tier (apps/org/rs/index.md, Gates), which the
# `scale` flow runs each night at a tenth of its size, about a million
# entries; its full size runs by hand. Like `cella-test`, it fetches the lockfile's
# packages for the offline install and runs on a dev cluster of its own
# ports, stopped after, pass or fail.
[[op]]
name = "cella-scale"
run = ["nix", "develop", "-c", "sh", "-c", "pnpm fetch --silent && export CELLA_PGPORT=$((20000 + $$ % 20000)) CELLA_ANALYTICS_PORT=$((40000 + $$ % 20000)); cella db start && cella test scale --members 1000; status=$?; cella db stop; exit $status"]
kind = "check"

# The integrator's pass (apps/org/rs/index.md, Gates): `merge` is corpus's
# own merge pass, an action run by its name (`corpus flow run merge`), and
# its needs are what it judges each version by over its train: the org's
# check, the whole suite in Chromium, Firefox and WebKit, `cella-test-all`,
# in place of the lane's Chromium-only `cella-test`, and the site's check,
# so a version merges only where every scenario passes in every browser,
# composed with the versions ahead of it; a WebKit or Firefox red stops
# the train though the lane's own gates ran green.
[[op]]
name = "merge"
kind = "action"
needs = ["cella-check", "cella-test-all", "site-check"]
