[package]
name = "cella"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]


[features]
default = ["pg18"]
pg18 = ["pgrx/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.18.1"
blake3 = "1"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"

[workspace]
