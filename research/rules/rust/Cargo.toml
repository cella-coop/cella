[package]
name = "lanterne-rules"
version = "0.0.0"
edition = "2024"
publish = false

# standalone: not a member of the repository's workspace
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"

# arithmetic overflow is a refusal, not a silent wrap, on every target
[profile.release]
overflow-checks = true
